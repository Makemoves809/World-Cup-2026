name: Update live data

on:
  schedule:
    # Match hours (games span many time zones, ~16:00–07:00 UTC): every 2 min
    # for fast live/final scores. ~0.5 req/min — well within the 10 req/min
    # free-tier limit.
    - cron: "*/2 16-23 * * *"
    - cron: "*/2 0-6 * * *"
    # Quiet hours (no matches in play): hourly.
    - cron: "20 7-15 * * *"
  workflow_dispatch:

concurrency:
  group: update-data
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  # Fetch finished results + red cards and commit them. The push triggers
  # Vercel's Git integration, which rebuilds and redeploys the site.
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsx scripts/update-data.ts
        env:
          FOOTBALL_API_KEY: ${{ secrets.FOOTBALL_API_KEY }}
      - name: Commit any data changes
        run: |
          if git diff --quiet; then
            echo "No data changes."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/data/live.json
            git commit -m "Update live results and red cards"
            git push
          fi
