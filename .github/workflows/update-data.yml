name: Update live data

on:
  schedule:
    # Every 5 minutes, all day — GitHub Actions' minimum scheduled interval.
    # Public repo = free unlimited Actions, and the script only commits when
    # data actually changes, so quiet-hour polls are cheap no-ops.
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: update-data
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  # Fetch finished results + red cards and commit them. The push triggers
  # Vercel's Git integration, which rebuilds and redeploys the site.
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsx scripts/update-data.ts
        env:
          FOOTBALL_API_KEY: ${{ secrets.FOOTBALL_API_KEY }}
      - name: Commit any data changes
        run: |
          if git diff --quiet; then
            echo "No data changes."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/data/live.json
            git commit -m "Update live results and red cards"
            git push
          fi
