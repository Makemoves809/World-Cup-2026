name: Update live data

on:
  schedule:
    # GitHub's own scheduler is unreliable for frequent crons (it throttles
    # and drops runs — often only ~1–2 h apart). So this schedule is just a
    # fallback. The reliable driver is an EXTERNAL cron (cron-job.org) that
    # hits the workflow_dispatch API every 5 min. The script only commits when
    # data actually changes, so empty polls are cheap no-ops.
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: update-data
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  # Fetch finished results + red cards and commit them. The push triggers
  # Vercel's Git integration, which rebuilds and redeploys the site.
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsx scripts/update-data.ts
        env:
          FOOTBALL_API_KEY: ${{ secrets.FOOTBALL_API_KEY }}
          # Optional — goal-scorer lookups (scripts/liveEvents.ts) use this
          # when set and fall back to ESPN's unofficial API when it's not.
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
      - name: Commit any data changes
        run: |
          if git diff --quiet; then
            echo "No data changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/live.json
          git commit -m "Update live results and red cards"
          # Push with rebase-retry to tolerate concurrent pushes to the branch.
          for i in 1 2 3 4 5; do
            if git push; then exit 0; fi
            echo "push rejected, rebasing (attempt $i)…"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
            sleep 2
          done
          echo "push failed after retries"; exit 1
