name: Update live data

# Champions League 2026/27 results bot (re-enabled Sep 2026 for the season).
# scripts/update-data.ts fetches the CL league phase from football-data.org
# (competition "CL") and writes results / kickoff times / matchdays to
# src/data/live.json; the push makes Vercel rebuild and redeploy the site.
#
# Driven by GitHub's native scheduler — no token needed (the old external
# cron's PAT was let expire). CL matchdays are ~twice a week, so this cadence
# is plenty; off-matchday runs are cheap no-ops (the script only commits when
# data actually changes). `workflow_dispatch` lets you force a run.
#
# The World Cup 2026 site is archived on branch archive/world-cup-2026.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

concurrency:
  group: update-data
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  # Fetch results + fixture times and commit them. The push triggers
  # Vercel's Git integration, which rebuilds and redeploys the site.
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsx scripts/update-data.ts
        env:
          FOOTBALL_API_KEY: ${{ secrets.FOOTBALL_API_KEY }}
          # Optional — goal-scorer lookups (scripts/liveEvents.ts) use this
          # when set and fall back to ESPN's unofficial API when it's not.
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
      # Goal scorers come from ESPN (no key) — football-data's free tier has
      # no goal events. Non-fatal: never let a scorer lookup break results.
      - run: npx tsx scripts/fetch-goals.ts || echo "goal fetch failed (non-fatal)"

      - name: Commit any data changes
        run: |
          if git diff --quiet; then
            echo "No data changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/live.json
          git commit -m "Update live results and red cards"
          # Push with rebase-retry to tolerate concurrent pushes to the branch.
          for i in 1 2 3 4 5; do
            if git push; then exit 0; fi
            echo "push rejected, rebasing (attempt $i)…"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
            sleep 2
          done
          echo "push failed after retries"; exit 1
